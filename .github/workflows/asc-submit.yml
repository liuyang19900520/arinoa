name: asc-submit
on:
  push:
    branches: [ci/asc-submit]
permissions:
  contents: read
concurrency:
  group: asc-submit
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          KEYFILE: /tmp/asc.p8
        run: |
          pip install -q pyjwt cryptography
          bash scripts/ci/write-asc-key.sh /tmp/asc.p8
          cd scripts/ci && cp -r ../../assets ../../ci-mode . && python3 asc_submit.py
          rm -f /tmp/asc.p8

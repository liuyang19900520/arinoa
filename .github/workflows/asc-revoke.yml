name: asc-revoke
on:
  push:
    branches: [ci/asc-revoke]
permissions:
  contents: read
concurrency:
  group: asc-revoke
jobs:
  cert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          KEYFILE: /tmp/asc.p8
        run: |
          pip install -q pyjwt cryptography
          bash scripts/ci/write-asc-key.sh /tmp/asc.p8
          python3 scripts/ci/asc_revoke.py
          rm -f /tmp/asc.p8

# Archive, sign, and upload Arinoa to TestFlight. Manual only for now
# (Actions tab → TestFlight → Run workflow) to avoid accidental uploads;
# add a push trigger once a develop branch exists. Uploading never submits
# for review.
#
# Needs secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8.
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      # Xcode 26+ ships the Metal toolchain separately; the app uses CI kernels.
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal Toolchain download skipped"

      # Build numbers only ever go up. Raise the BUILD_NUMBER_OFFSET
      # repository variable if App Store Connect rejects a number as used.
      - name: Choose build number
        env:
          OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + OFFSET ))" >> "$GITHUB_ENV"

      - name: Create keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: scripts/ci/testflight.sh

      - name: Summary
        run: echo "Uploaded build $BUILD_NUMBER. Check TestFlight in App Store Connect once processing finishes." >> "$GITHUB_STEP_SUMMARY"
